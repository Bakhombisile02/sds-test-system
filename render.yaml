# Render Blueprint — SDS Test System Staging
# https://render.com/docs/blueprint-spec
#
# Usage:
#   1. Push this file to the repo
#   2. On Render dashboard → New → Blueprint Instance → select this repo
#   3. Render will auto-provision all three services below
#   4. After first deploy, run migrations via Render Shell:
#        cd backend && npx sequelize-cli db:migrate && npx sequelize-cli db:seed:all

databases:
  - name: sds-test-db-staging
    plan: free
    databaseName: sds_test_db
    user: sds_user

services:
  # ── Backend API (Express.js) ──────────────────────────────
  - type: web
    name: sds-test-api-staging
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx sequelize-cli db:migrate && npx sequelize-cli db:seed:all
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: API_VERSION
        value: v1
      - key: DATABASE_URL
        fromDatabase:
          name: sds-test-db-staging
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 24h
      - key: JWT_REFRESH_EXPIRE
        value: 7d
      - key: FRONTEND_URL
        sync: false  # Set to https://<frontend-url>.onrender.com after first deploy
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false

  # ── Frontend (React SPA) ─────────────────────────────────
  - type: web
    name: sds-test-staging
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        sync: false  # Set to https://<backend-url>.onrender.com after first deploy
